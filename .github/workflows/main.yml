name: Build IPA
on:
  workflow_dispatch:
    inputs:
      game_url:
        description: 'Enlace directo de Filebin con CelesteFiles.zip'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Download and Prepare Game Files
      run: |
        curl -L -o CelesteFiles.zip "${{ github.event.inputs.game_url }}"
        mkdir -p game_input
        unzip CelesteFiles.zip -d game_input/
        
        # Si los archivos quedaron dentro de una subcarpeta (como 'Celeste IOS'), los saca a la raíz de game_input
        if [ -d "game_input/Celeste IOS" ]; then
          mv game_input/"Celeste IOS"/* game_input/ 2>/dev/null || true
        elif [ -d "game_input/"* ]; then
          mv game_input/*/* game_input/ 2>/dev/null || true
        fi

    - name: Direct .NET Build (Using Game Assets)
      run: |
        cd celestemeow
        dotnet build celestemeow.csproj -c Release /p:Platform=iPhone /p:ReferencePath="../game_input"

    - name: Package IPA
      run: |
        mkdir -p Payload/Celeste.app
        cp -r celestemeow/bin/iPhone/Release/* Payload/Celeste.app/ 2>/dev/null || cp -r bin/Release/* Payload/Celeste.app/ 2>/dev/null || true
        cp -r game_input/Content Payload/Celeste.app/
        cp -f game_input/Celeste.exe Payload/Celeste.app/ 2>/dev/null || true
        cp -f game_input/*.dll Payload/Celeste.app/ 2>/dev/null || true
        zip -r celestemeow.ipa Payload

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: celestemeow-ipa
        path: celestemeow.ipa
