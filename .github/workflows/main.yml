name: Build IPA
on:
  workflow_dispatch:
    inputs:
      game_url:
        description: 'Enlace directo de Filebin con CelesteFiles.zip'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout base code
      uses: actions/checkout@v4
      with:
        submodules: false # No descargamos nada automático todavía

    - name: Force Global HTTPS Protocol
      run: |
        # Fuerza a todo el sistema Git a redirigir cualquier enlace git:// hacia https:// de forma obligatoria y profunda
        git config --global url."https://github.com".insteadOf "git://://github.com"
        
        # Parcheamos el archivo del nivel raíz por seguridad
        if [ -f ".gitmodules" ]; then
          sed -i 's|git://://github.com|https://github.com|g' .gitmodules
        fi
        
        # Sincroniza e inicializa los submódulos base
        git submodule sync
        git submodule update --init
        
        # Entramos a la carpeta descargada de FNA y forzamos el parche también en sus submódulos internos ocultos
        if [ -d "FNA" ]; then
          cd FNA
          git config --local url."https://github.com".insteadOf "git://://github.com"
          if [ -f ".gitmodules" ]; then
            sed -i 's|git://://github.com|https://github.com|g' .gitmodules
          fi
          git submodule sync
          cd ..
        fi
        
        # Descarga final profunda de todos los componentes de audio y video sin excepciones
        git submodule update --init --recursive

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Download and Prepare Game Files
      run: |
        curl -L -o CelesteFiles.zip "${{ github.event.inputs.game_url }}"
        mkdir -p game_input
        unzip CelesteFiles.zip -d game_input/

    - name: Direct .NET Build
      run: |
        dotnet build celestemeow.sln -c Release /p:Platform=iPhone

    - name: Package IPA
      run: |
        mkdir -p Payload/Celeste.app
        cp -r celestemeow/bin/iPhone/Release/* Payload/Celeste.app/ 2>/dev/null || cp -r bin/Release/* Payload/Celeste.app/ 2>/dev/null || true
        cp -r game_input/Content Payload/Celeste.app/
        cp -f game_input/Celeste.exe Payload/Celeste.app/ 2>/dev/null || true
        cp -f game_input/*.dll Payload/Celeste.app/ 2>/dev/null || true
        zip -r celestemeow.ipa Payload

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: celestemeow-ipa
        path: celestemeow.ipa
