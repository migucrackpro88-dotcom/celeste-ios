name: Build IPA
on:
  workflow_dispatch:
    inputs:
      game_url:
        description: 'Enlace directo de Filebin con CelesteFiles.zip'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Download and Prepare Game Files
      run: |
        curl -L -o CelesteFiles.zip "${{ github.event.inputs.game_url }}"
        mkdir -p game_input
        unzip CelesteFiles.zip -d game_input/
        
        # Corrección de estructura interna por si acaso
        if [ -d "game_input/Content" ]; then
          mkdir -p game_input/Celeste.app
          mv game_input/Content game_input/Celeste.app/ 2>/dev/null || true
          mv game_input/Celeste.exe game_input/Celeste.app/ 2>/dev/null || true
          mv game_input/*.dll game_input/Celeste.app/ 2>/dev/null || true
        fi

    - name: Build Project
      run: |
        chmod +x build.sh
        # Forzamos al script a leer la carpeta que creamos pasándole la ruta como argumento
        ./build.sh "$(pwd)/game_input" || ./build.sh "$(pwd)/game_input/Celeste.app"

    - name: Package IPA
      run: |
        mkdir Payload
        mv Celeste.app Payload/ 2>/dev/null || mv *.app Payload/ 2>/dev/null || true
        zip -r celestemeow.ipa Payload

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: celestemeow-ipa
        path: celestemeow.ipa
